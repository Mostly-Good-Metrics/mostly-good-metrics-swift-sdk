name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to test'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift Version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run Tests
        run: swift test

      - name: Actor-Isolation Regression Tests
        run: swift test --scratch-path .build/actor-checks -Xswiftc -enable-actor-data-race-checks

      - name: Thread Sanitizer Concurrency Regressions
        run: swift test --scratch-path .build/thread-sanitizer --sanitize=thread --filter 'FlushConcurrencyTests|NetworkConcurrencyTests|IdentityConcurrencyTests|ContextProviderConcurrencyTests|HostSafetyTests|BoundedResponseTests'

      - name: Swift 6 Consumer Regression
        run: swift run --package-path Tests/Swift6Consumer --scratch-path .build/swift6-consumer Swift6Consumer

      - name: Optimized Swift 6 Consumer Regression
        run: swift run -c release -Xswiftc -enable-testing --package-path Tests/Swift6Consumer --scratch-path .build/swift6-consumer-release Swift6Consumer

      - name: Optimized Swift 6 Host Safety Regression
        run: |
          swift run -c release -Xswiftc -enable-testing --package-path Tests/Swift6Consumer --scratch-path .build/swift6-consumer-release Swift6Consumer --host-safety-control
          swift run -c release -Xswiftc -enable-testing --package-path Tests/Swift6Consumer --scratch-path .build/swift6-consumer-release Swift6Consumer --host-safety-only
          swift run -c release -Xswiftc -enable-testing --package-path Tests/Swift6Consumer --scratch-path .build/swift6-consumer-release Swift6Consumer --readiness-safety-only

      - name: Swift 6 Flush Actor Contract Compile Regression
        run: |
          bash Tests/Swift6CompileFailures/check.sh debug
          bash Tests/Swift6CompileFailures/check.sh release

      - name: Main-Thread Performance Regression
        env:
          MGM_RUN_PERFORMANCE_TESTS: "1"
        run: swift test -c release --filter MainThreadPerformanceTests/testTrackDoesNotBlockMainThreadOnStorage

  build-platforms:
    name: Build for ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: "generic/platform=iOS Simulator"
          - platform: macOS
            destination: "platform=macOS"
          - platform: tvOS
            destination: "generic/platform=tvOS Simulator"
          - platform: watchOS
            destination: "generic/platform=watchOS Simulator"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for ${{ matrix.platform }}
        run: |
          xcodebuild build \
            -scheme MostlyGoodMetrics \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            | xcpretty && exit ${PIPESTATUS[0]}

  ios-concurrency:
    name: iOS Actor-Isolation Regression Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run on iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, items in devices.items()
              if "iOS" in runtime for d in items if "iPhone" in d["name"]))')
          xcodebuild test \
            -scheme MostlyGoodMetrics \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:MostlyGoodMetricsTests/FlushConcurrencyTests \
            -only-testing:MostlyGoodMetricsTests/NetworkConcurrencyTests \
            -only-testing:MostlyGoodMetricsTests/IdentityConcurrencyTests \
            -only-testing:MostlyGoodMetricsTests/ContextProviderConcurrencyTests \
            -only-testing:MostlyGoodMetricsTests/HostSafetyTests \
            -only-testing:MostlyGoodMetricsTests/BoundedResponseTests \
            OTHER_SWIFT_FLAGS='$(inherited) -enable-actor-data-race-checks' \
            -skipPackagePluginValidation
